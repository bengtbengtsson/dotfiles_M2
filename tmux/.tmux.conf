# Set the status bar at the top
#set-option -g status-position top

# Start window numbering from 1
set-option -g base-index 1

set -g mouse on
bind -Tcopy-mode-vi WheelUpPane send -X scroll-up
bind -Tcopy-mode-vi WheelDownPane send -X scroll-down

# Set the default terminal
set-option -g default-terminal "tmux-256color"

# Allow Yazi image preview passthrough
set-option -g allow-passthrough on
set-option -ga update-environment "TERM TERM_PROGRAM"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (repeatable: hold the key after prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
